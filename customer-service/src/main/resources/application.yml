server:
  port: 8081
spring:
  application:
    name: customer-service
  config:
    import: "optional:configserver:${CONFIG_URL:http://localhost:8888}"
  datasource:
    url: jdbc:h2:mem:customers_db
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
  ai:
    mcp:
      server:
        name: customer-mcp-server
        protocol: STREAMABLE
